<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务边界试聊</title><link rel="stylesheet" href="/style.css"><script type="module" src="/service-boundary.js"></script><body><main><header><h1 id="page-title">店主分身 · 服务边界试聊</h1><a href="/evaluation">查看验收</a></header><p class="notice">仅本机草稿，不发送微信、不更新客户档案。模型选择服务动作，程序输出限定表达；识别、关联上下文和本人相似度仍需核对。</p><section class="settings"><label>基础语气<select id="tone"><option value="warm">热情直接，少催买</option><option value="plain">平常简短</option></select></label><div id="conversation" role="log" aria-live="polite"></div><form id="form"><label>客户这句话<textarea id="message" maxlength="800" rows="3" required></textarea></label><button id="send" type="submit">试聊一句</button><button id="reset" type="button">清空并重新开始</button></form><p id="status" role="status">可连续输入几轮客户问法；资料未核实时不会给确定的商品、补配或工期承诺。</p><p id="receipt"></p></section><p>历史仅在当前试聊内短时保留，不写入店主风格资料；清空后使用新会话。表达库尚未由店主核准，可能显得重复或没接住指代。</p><a href="/two-step">两步理解测试</a> · <a href="/">原模拟工作台</a></main></body></html>
