<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务步骤边界演练</title><link rel="stylesheet" href="/style.css"><script type="module" src="/bounded-service.js"></script><body><main><h1 id="page-title">先理解话题，再选择服务表达</h1><p>仅本机演练，固定表达均为系统草稿，未获门店核准。场景需你手动选择；不证明自动识别、本人风格或真实服务已达标。模型只能选两种现成表达，不能写新建议。</p><p>填客户原话，点“先理解这次想解决什么”；核对方向后采用，再测试表达。也可以手动选场景。</p><section class="settings"><label>明确选择本轮场景<select id="scenario"><option value="">请选择，不自动猜测</option><option value="selection_general">自用选购搭配</option><option value="gift_general">送礼选择</option><option value="repair_general">维修或补配咨询</option><option value="care_unknown">保养咨询</option><option value="return_unknown">退换咨询</option><option value="recycle_unknown">回收咨询</option><option value="chat_general">普通家常闲聊</option><option value="repair_missing">耳堵缺失</option><option value="repair_replace">只补原配件</option><option value="ring_size">送礼圈号未知</option><option value="mood">心情不好，暂停选购</option><option value="privacy">不想解释或被分析</option><option value="pause">今天先不买</option><option value="remodel_discover">已有首饰想改款</option><option value="remodel_preserve">已明确保留原玉、简洁日常</option><option value="remodel_estimate">询问改款可行性、费用或工期</option></select></label><p>选定场景也代表你已核对其适用条件；选错场景仍可能答非所问。</p><label>客户这句话<textarea id="message" maxlength="800" rows="3"></textarea></label><button id="suggest">先理解这次想解决什么</button><p id="proposal" role="status"></p><button id="use-proposal" hidden>我已核对，采用建议场景</button><button id="run">测试表达选择</button><p id="status" role="status"></p><div id="reply" role="log"></div><p id="receipt"></p></section><p>不会发送微信、更新客户档案或执行查询、维修、退款。此页不是自由对话模式。</p><a href="/two-step">新试验：两步理解当前需求</a> · <a href="/topic-frame">试验新版：区分闲聊与选购意愿</a> · <a href="/">返回原试聊</a> · <a href="/evaluation">查看验收记录</a></main></body></html>
