name: product-image-engine

x-backend-build: &backend-build
  context: ../services/backend
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://product_engine:product_engine_dev@postgres:5432/product_engine
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: product-engine-dev
  S3_ACCESS_KEY_ID: product_engine_dev
  S3_SECRET_ACCESS_KEY: local-development-only
  ALBUM_SIGNING_SECRET: ${ALBUM_SIGNING_SECRET:?set ALBUM_SIGNING_SECRET}
  SALES_SIGNING_SECRET: ${SALES_SIGNING_SECRET:?set SALES_SIGNING_SECRET}
  STYLE_SIGNING_SECRET: ${STYLE_SIGNING_SECRET:?set STYLE_SIGNING_SECRET}
  ADMIN_SIGNING_SECRET: ${ADMIN_SIGNING_SECRET:?set ADMIN_SIGNING_SECRET}
  SALES_WEBHOOK_URL: ${SALES_WEBHOOK_URL:?set SALES_WEBHOOK_URL}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_engine
      POSTGRES_USER: product_engine
      POSTGRES_PASSWORD: product_engine_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_engine -d product_engine"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: product_engine_dev
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 product_engine_dev local-development-only &&
        mc mb --ignore-existing local/product-engine-dev &&
        mc anonymous set none local/product-engine-dev
    restart: "no"

  migrate:
    build: *backend-build
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *backend-build
    command:
      - .venv/bin/uvicorn
      - product_engine.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *backend-environment
    ports:
      - "${PRODUCT_ENGINE_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "unless-stopped"

  outbox-worker:
    build: *backend-build
    command:
      - .venv/bin/python
      - -m
      - product_engine.workers.outbox_daemon
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "unless-stopped"

volumes:
  postgres-data:
  minio-data:
