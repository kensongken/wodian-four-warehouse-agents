name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, typecheck, and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --all-groups

      - name: Verify dependency lock
        run: uv lock --check --offline

      - name: Check changed-file formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          changed_files="$(mktemp)"
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- '*.py' \
            > "$changed_files"
          if [ -s "$changed_files" ]; then
            xargs -0 uv run ruff format --check < "$changed_files"
          fi

      - name: Run static checks
        run: |
          uv run ruff check src tests scripts
          uv run mypy src

      - name: Run full test suite
        run: uv run pytest -q
